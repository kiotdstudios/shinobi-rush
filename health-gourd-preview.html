<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Shinobi Rush · Health Gourd Preview</title><style>body{margin:0;background:#111923;color:#f4e8d2;font:16px system-ui;text-align:center;padding:24px 12px}h1{font-size:24px}#stage{margin:20px auto;background:radial-gradient(circle,#34414b,#161d27 72%);border:2px solid #6b6251;border-radius:18px;max-width:420px;aspect-ratio:1;display:grid;place-items:center;position:relative}img{width:72%;height:72%;object-fit:contain;image-rendering:pixelated;position:absolute}button{background:#e3ae55;border:0;border-radius:10px;padding:12px 22px;font-weight:bold}input{width:250px}small{display:block;color:#b5c1c9;margin:12px}#state{color:#ffc875}</style><h1>Shinobi Rush · Health Gourd</h1><p>Animated art proof · mobile viewer</p><div id="stage"><img id="glow"><img id="gourd"><img id="ember"></div><div id="state">Loading frames…</div><p><button id="play">Pause</button></p><label>Speed <input id="speed" type="range" min="4" max="24" value="12"> <span id="fps">12</span> fps</label><small>17 gourd frames · 9 ember frames · glow overlay</small><script>const root='assets/pickups/health_gourd/';const g=document.getElementById('gourd'),e=document.getElementById('ember'),gl=document.getElementById('glow');const frames=(stem,n)=>Array.from({length:n},(_,i)=>root+stem+'_'+String(i).padStart(2,'0')+'.png');const gs=frames('gourd',17),es=frames('ember',9);let i=0,running=true,last=0;for(const s of [...gs,...es,root+'glow_00.png']){const img=new Image();img.src=s}gl.src=root+'glow_00.png';g.onerror=()=>document.getElementById('state').textContent='Image failed to load';g.onload=()=>document.getElementById('state').textContent='Playing original repository frames';function tick(t){const fps=+document.getElementById('speed').value;if(running&&t-last>1000/fps){g.src=gs[i%gs.length];e.src=es[i%es.length];i++;last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'Pause':'Play'};document.getElementById('speed').oninput=ev=>document.getElementById('fps').textContent=ev.target.value;</script></html>
