name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-orders-and-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent instructions, camera standard, and order format
        shell: bash
        run: |
          set -euo pipefail
          for file in AGENTS.md orders/README.md orders/Aki/README.md orders/Orcha/README.md orders/Kiro/README.md orders/Codex/README.md docs/visuals/CAMERA_AND_ART_DIRECTION.md assets/characters/player/references/baseline_turnaround.png; do
            test -s "$file" || { echo "::error file=$file::Required file missing or empty"; exit 1; }
          done
          python3 scripts/ci/validate_orders.py
      - name: Detect Godot project and export readiness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' projects < <(find . -name project.godot -not -path './.git/*' -print0)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::notice::No Godot project found. Godot build checks are NOT configured or passing; follow the bootstrap order."
            exit 0
          fi
          if [ "${#projects[@]}" -gt 1 ]; then
            echo "::error::Multiple Godot projects found; configure explicit project root."
            exit 1
          fi
          project_dir="$(dirname "${projects[0]}")"
          echo "Found Godot project: $project_dir"
          if [ ! -f "$project_dir/export_presets.cfg" ]; then
            echo "::warning::Godot project exists but export_presets.cfg is missing. Live Web export is NOT ready."
          fi
