<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shinobi Rush — Jutsu Cards</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#000;color:#f8f8f8}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,48px)}main{max-width:1020px;margin:auto}h1{font-size:clamp(26px,4vw,44px);font-weight:650;margin:0 0 28px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}.tabs button{border:1px solid #363636;background:#181818;color:#ddd;padding:10px 14px;border-radius:999px;cursor:pointer}.tabs button[aria-selected=true]{background:#303030;border-color:#777;color:#fff}.card{border:2px solid #222;border-radius:34px;padding:clamp(22px,3vw,34px);max-width:970px}.identity{display:flex;gap:30px;align-items:center;padding-bottom:28px;border-bottom:1px solid #1c1c1c}.art{width:29%;max-width:290px;min-width:140px;aspect-ratio:1;background:linear-gradient(145deg,#052d33,#071720 70%);border:2px solid #173a40;border-radius:32px;display:grid;place-items:center;overflow:hidden}.art svg{width:100%;height:100%}.identity h2{font-size:clamp(26px,4vw,46px);margin:0 0 14px;line-height:1.1}.sub{color:#aaa;font-size:clamp(16px,2.5vw,27px);margin:0 0 14px}.tag{display:inline-block;background:#262626;color:#dedede;border-radius:999px;padding:7px 15px;font-size:clamp(14px,2vw,22px)}.stats{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:26px;padding:34px 0 28px}.stat-label{color:#aaa;font-size:clamp(16px,2.5vw,27px);margin-bottom:18px}.stat-value{font-size:clamp(32px,5vw,52px);font-weight:650;line-height:1.1}.positive{color:#09ba58}.result{background:#252525;border-radius:28px;padding:26px 30px}.result h3{font-size:clamp(20px,3vw,32px);font-weight:550;margin:0 0 22px}.result-row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;font-size:clamp(17px,2.7vw,28px);margin:18px 0}.result-row .label{color:#aaa}.result-row .value{font-weight:550;text-align:right}.footnote{color:#aaa;font-size:clamp(14px,2vw,22px);line-height:1.5;margin:28px 0 0}.nav{color:#999;font-size:14px;margin:0 0 12px}@media(max-width:540px){.identity{gap:14px}.art{min-width:112px;border-radius:18px}.identity h2{font-size:25px}.sub{font-size:15px}.stats{gap:22px 12px}.stat-label{font-size:15px;margin-bottom:10px}.result{padding:20px;border-radius:20px}.result-row{font-size:16px}}
</style></head><body><main><p class="nav">SHINOBI RUSH / VISUAL LIBRARY / JUTSU</p><h1>Jutsu Build Cards</h1><nav class="tabs" id="tabs" aria-label="Select jutsu"></nav><article class="card" id="card" aria-live="polite"></article></main>
<script>
const cards=[{"slug":"fireball","name":"Fireball Jutsu","element":"Fire Element","kind":"Offensive Technique","base":"100","bonus":"+20%","secondary":"10/s","secondaryLabel":"Base Burn Damage","gearLabel":"Headband Burn Bonus","gear":"+25%","result":[["Fireball direct damage","120"],["Burn damage per second","12.5"],["Strength attribute","+2"]],"symbol":"🔥","note":"Burn damage is calculated separately here from direct jutsu damage."},{"slug":"lightning-strike","name":"Lightning Strike","element":"Lightning Element","kind":"Offensive Technique","base":"100","bonus":"+20%","secondary":"100","secondaryLabel":"Base Lightning Damage","gearLabel":"Lightning Damage Bonus","gear":"+10%","result":[["Lightning direct damage","132"],["Chakra attribute","+15"],["Jutsu Power","+20%"]],"symbol":"⚡","note":"Lightning bonus and Jutsu Power multiply in this example."},{"slug":"wind-palm","name":"Wind Palm","element":"Wind Element","kind":"Control Technique","base":"80","bonus":"+20%","secondary":"80","secondaryLabel":"Base Wind Damage","gearLabel":"Wind Damage Bonus","gear":"+10%","result":[["Wind Palm direct damage","105.6"],["Speed attribute","+2"],["Knockback","Active"]],"symbol":"🌀","note":"Knockback and interruption are qualitative effects."},{"slug":"shadow-clone","name":"Shadow Clone","element":"Clone Technique","kind":"Utility / Offensive","base":"60","bonus":"+20%","secondary":"60","secondaryLabel":"Base Clone Hit","gearLabel":"Clone Damage Bonus","gear":"+15%","result":[["Clone attack damage","82.8"],["Defense attribute","+2"],["Clone behavior","TBD"]],"symbol":"👤","note":"Clone damage and mechanics are illustrative and not finalized."},{"slug":"substitution","name":"Substitution Jutsu","element":"Defensive Technique","kind":"L2 Ability","base":"3","bonus":"—","secondary":"3","secondaryLabel":"Starting Charges","gearLabel":"Recovery Bonus","gear":"-10%","result":[["Available charges","3"],["Recovery time","-10%"],["Speed attribute","+2"]],"symbol":"💨","note":"Three charges recharge independently; numerical cooldowns remain TBD."}];
function icon(c){const colors={fireball:["#ff6d12","#ffe265"],"lightning-strike":["#2974e8","#b6f4ff"],"wind-palm":["#4ea9df","#e6f9ff"],"shadow-clone":["#5982c9","#c8d9ff"],substitution:["#73a9c7","#e7f7ff"]};const pair=colors[c.slug];return '<svg viewBox="0 0 200 200" role="img" aria-label="'+c.name+' concept icon"><defs><radialGradient id="glow"><stop stop-color="'+pair[1]+'"/><stop offset=".6" stop-color="'+pair[0]+'"/><stop offset="1" stop-color="'+pair[0]+'" stop-opacity="0"/></radialGradient></defs><circle cx="100" cy="100" r="79" fill="url(#glow)" opacity=".4"/><path d="M34 144 Q54 98 110 42 Q156 29 171 77 Q179 127 116 155 Q76 166 34 144Z" fill="url(#glow)" stroke="'+pair[1]+'" stroke-width="3"/><text x="100" y="128" font-size="80" text-anchor="middle">'+c.symbol+'</text></svg>'}
function render(i){const c=cards[i];document.getElementById("card").innerHTML='<div class="identity"><div class="art">'+icon(c)+'</div><div><h2>'+c.name+'</h2><p class="sub">'+c.element+' · '+c.kind+'</p><span class="tag">Example build</span></div></div><section class="stats"><div><div class="stat-label">Base '+(c.slug==="substitution"?"Charges":"Damage")+'</div><div class="stat-value">'+c.base+'</div></div><div><div class="stat-label">Jutsu Power Bonus</div><div class="stat-value positive">'+c.bonus+'</div></div><div><div class="stat-label">'+c.secondaryLabel+'</div><div class="stat-value">'+c.secondary+'</div></div><div><div class="stat-label">'+c.gearLabel+'</div><div class="stat-value positive">'+c.gear+'</div></div></section><section class="result"><h3>With the equipment equipped</h3>'+c.result.map(r=>'<div class="result-row"><span class="label">'+r[0]+'</span><span class="value '+(r[1].startsWith("+")||r[0].includes("per second")?"positive":"")+'">'+r[1]+'</span></div>').join("")+'</section><p class="footnote">Illustrative numbers, not final game balance. '+c.note+'</p>';document.querySelectorAll(".tabs button").forEach((b,j)=>b.setAttribute("aria-selected",String(i===j)))}
document.getElementById("tabs").innerHTML=cards.map((c,i)=>'<button type="button" data-index="'+i+'" aria-selected="false">'+c.name+'</button>').join("");document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)render(Number(b.dataset.index))});render(0);
</script></body></html>
