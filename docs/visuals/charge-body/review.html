<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../../../icon.svg"><title>Player + bandit charge-body review</title>
<style>body{margin:0;background:#182432;color:#e4f0ff;font:16px system-ui;text-align:center}main{max-width:940px;margin:auto;padding:18px}h1{font-size:24px}.figures{display:flex;justify-content:center;gap:20px}.figure{width:min(40vw,320px)}.figure img{width:100%;image-rendering:pixelated;background:#233141}button,select{font:inherit;color:white;background:#2b425a;border:1px solid #6686a7;padding:9px;border-radius:5px;margin:4px}p{color:#adc5db;line-height:1.5}input[type=range]{width:min(85vw,650px)}#directions button[aria-pressed=true]{background:#437d9a}.footline{height:1px;background:#7f9daf;margin-top:-9.375%;position:relative;pointer-events:none}</style>
<main><h1>Charging stance — player and bandit</h1><p>Body animation only • joined hand seal • wide planted stance</p><div class="figures"><div class="figure"><p>PLAYER</p><img id="player" alt="Player charging"><div class="footline"></div></div><div class="figure"><p>BANDIT</p><img id="bandit" alt="Bandit charging"><div class="footline"></div></div></div><p id="status" role="status">Loading…</p>
<div><button id="normal">Normal</button><button id="half">Half speed</button><button id="pause">Pause</button><button id="step">Step frame</button></div><div id="directions"></div><input id="scrub" type="range" min="0" max="15" value="0" aria-label="Frame"><p>The line marks the shared foot anchor. No aura is shown so the hands, shoulders and stance can be inspected clearly.</p></main>
<script type="module">
const m=await(await fetch('manifest.json')).json(),$=id=>document.getElementById(id);let direction='SE',speed=.5,paused=false,time=0,last=performance.now(),index=0;
const loaded={};for(const c of ['player','bandit']){loaded[c]={};for(const d of m.directions){loaded[c][d]=await Promise.all(m.characters[c][d].map(async path=>{const im=new Image();im.src='../../../'+path.replace('res://','');await im.decode();return im}))}}
for(const d of m.directions){const b=document.createElement('button');b.textContent=d;b.setAttribute('aria-pressed',d===direction);b.onclick=()=>{direction=d;time=0;index=0;for(const el of $('directions').children)el.setAttribute('aria-pressed',el.textContent===d)};$('directions').append(b)}
$('normal').onclick=()=>{speed=1;paused=false};$('half').onclick=()=>{speed=.5;paused=false};$('pause').onclick=()=>paused=!paused;$('step').onclick=()=>{paused=true;index=(index+1)%16;time=index/m.fps};$('scrub').oninput=()=>{paused=true;index=+$('scrub').value;time=index/m.fps};
function render(now){if(!paused){time+=(now-last)/1000*speed;time%=16/m.fps;index=Math.floor(time*m.fps)}last=now;for(const c of ['player','bandit'])$(c).src=loaded[c][direction][index].src;$('scrub').value=index;$('status').textContent=`${direction} | frame ${index+1}/16 | ${speed}× | ${time.toFixed(3)}s${paused?' | PAUSED':''}`;window.__CHARGE_BODY_REVIEW__={ready:true,direction,index,speed,paused,time,loaded:256};requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
