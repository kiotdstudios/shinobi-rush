<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../../../icon.svg"><title>Blue charge V2 review</title>
<style>body{margin:0;background:#14202c;color:#e8f4ff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}h1{font-size:24px}.stage{position:relative;width:min(75vw,512px);aspect-ratio:1;margin:auto;background:#1d2935;border:1px solid #31465c}.stage img{position:absolute;image-rendering:pixelated}#fx{width:100%;height:100%;left:0;top:0}#body{width:50%;height:50%;left:25%;top:42.1875%}button,select{font:inherit;padding:9px;margin:4px;background:#243c54;color:white;border:1px solid #6d95b8;border-radius:5px}input[type=range]{width:min(80vw,620px)}p{line-height:1.5;color:#abc8df}#source{image-rendering:pixelated;width:min(90%,864px);height:auto}label{display:inline-block;margin:10px}</style>
<main><h1>Blue chakra charge — reference V2</h1><p>96 new frames • blue-white curls, strands and sparks • VFX candidate</p>
<div class="stage"><img id="body" alt="Approved player idle for scale" src="../../../assets/characters/player/sprites/production/idle/SE_000.png"><img id="fx" alt="Blue charging energy"></div>
<p id="status" role="status">Loading…</p><div><button id="normal">Normal</button><button id="half">Half speed</button><button id="pause">Pause</button><button id="step">Step frame</button></div>
<label>Sequence <select id="mode"><option value="full">Buildup → charge → release</option><option value="sustain">Continuous charge</option></select></label><label><input id="showBody" type="checkbox" checked> Player for scale</label><br>
<input id="scrub" type="range" min="0" max="95" value="0" aria-label="Frame"><p>The body is existing approved idle artwork. This review changes only the VFX.</p>
<p>Original downloaded reference (9 frames)</p><img id="source" src="../../../assets/vfx/chakra_charge_blue_v2/source/reference-pink.png" alt="Owner supplied pink nine-frame source"></main>
<script type="module">
const manifest=await(await fetch('../../../assets/vfx/chakra_charge_blue_v2/manifest.json')).json();
const frames=await Promise.all(manifest.frames.map(async f=>{const im=new Image();im.src='../../../assets/vfx/chakra_charge_blue_v2/'+f.path;await im.decode();return im}));
let speed=.5,paused=false,time=0,last=performance.now(),index=0;
const $=id=>document.getElementById(id),range=()=>$('mode').value==='sustain'?[16,80]:[0,96];
$('normal').onclick=()=>{speed=1;paused=false};$('half').onclick=()=>{speed=.5;paused=false};$('pause').onclick=()=>paused=!paused;
$('step').onclick=()=>{paused=true;const[a,b]=range();index=a+(index-a+1)%(b-a);time=(index-a)/24};
$('mode').onchange=()=>{time=0;index=range()[0]};$('showBody').onchange=()=>$('body').hidden=!$('showBody').checked;
$('scrub').oninput=()=>{paused=true;index=+$('scrub').value;if(index<range()[0]||index>=range()[1]){$('mode').value='full'}time=(index-range()[0])/24};
function render(now){const[a,b]=range();if(!paused){time+=(now-last)/1000*speed;time%=((b-a)/24);index=a+Math.floor(time*24)}last=now;
 $('fx').src=frames[index].src;$('scrub').value=index;$('status').textContent=`${manifest.frames[index].phase.toUpperCase()} | frame ${index+1}/96 | ${speed}× | ${time.toFixed(3)}s${paused?' | PAUSED':''}`;
 window.__CHARGE_REVIEW__={ready:true,index,speed,paused,mode:$('mode').value,phase:manifest.frames[index].phase,body:!$('body').hidden,loaded:frames.length};requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
