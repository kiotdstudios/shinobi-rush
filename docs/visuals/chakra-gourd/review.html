<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../../../icon.svg"><title>Chakra gourd review</title>
<style>body{margin:0;background:#111b25;color:#e4f4ff;font:16px system-ui;text-align:center}main{max-width:800px;margin:auto;padding:16px}canvas{width:100%;image-rendering:pixelated;background:#15212c}button{background:#29435b;color:white;border:1px solid #6596b2;padding:10px;margin:5px;border-radius:5px}p{color:#abc8dc}output{display:block;margin:8px}</style>
<main><h2>Health / Chakra gourd</h2><p>PixelLab body art · matching glow and spark animation · separate transparent layers</p><canvas width="720" height="520" aria-label="Animated health and chakra gourds"></canvas><div><button id="half">Half speed</button><button id="normal">Normal</button><button id="pause">Pause</button><button id="step">Step</button></div><div><button id="detail">2× detail</button><button id="game">Gameplay scale</button></div><output id="status">Loading…</output><p>Art review only. No player-charge VFX or gameplay changes.</p></main>
<script type="module">
const root='../../../assets/pickups/',m=await(await fetch(root+'chakra_gourd/chakra_gourd.art.json')).json();
const load=path=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=path});
const layers=async(dir,count)=>({body:await Promise.all(Array.from({length:count},(_,n)=>load(root+dir+'/gourd_'+String(n).padStart(2,'0')+'.png'))),glow:await load(root+dir+'/glow_00.png'),ember:await Promise.all(Array.from({length:9},(_,n)=>load(root+dir+'/ember_'+String(n).padStart(2,'0')+'.png')))});
const skins=await Promise.all([layers('health_gourd',17),layers('chakra_gourd',m.layers.gourd.frames.length)]);
function tint(im,mul){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height);for(let n=0;n<d.data.length;n+=4)for(let k=0;k<3;k++)d.data[n+k]=Math.floor(d.data[n+k]*mul[k]);x.putImageData(d,0,0);return c}
skins[0].glow=tint(skins[0].glow,[1,.5,.4]);skins[1].glow=tint(skins[1].glow,[.4,.7,1]);
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),status=document.querySelector('#status');let time=0,speed=.5,paused=false,zoom=2,last=performance.now();
function sprite(im,x,y,scale=1,angle=0,alpha=1,add=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.globalAlpha=alpha;ctx.globalCompositeOperation=add?'lighter':'source-over';ctx.drawImage(im,-im.width/2,-im.height/2);ctx.restore()}
function render(){ctx.imageSmoothingEnabled=false;ctx.fillStyle='#15212c';ctx.fillRect(0,0,720,520);ctx.font='18px system-ui';ctx.fillStyle='white';ctx.textAlign='center';ctx.fillText('HEALTH',180,42);ctx.fillText('CHAKRA',540,42);
 for(let i=0;i<2;i++){const s=skins[i],cx=i?540:180,p=.5+.5*Math.sin(time*3.1),rgb=i?'26,115,255':'255,46,26';ctx.save();ctx.translate(cx,450);ctx.scale(zoom,zoom);for(let n=0;n<7;n++){const k=n/6,r=(46-34*k)*(.94+.06*p);ctx.fillStyle=`rgba(${rgb},${(.05+.15*k)*(.8+.4*p)})`;ctx.beginPath();ctx.ellipse(0,0,r,r*.5,0,0,Math.PI*2);ctx.fill()}const gradient=ctx.createLinearGradient(0,0,0,-170);gradient.addColorStop(0,`rgba(${rgb},${.16+.07*p})`);gradient.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=gradient;ctx.beginPath();ctx.moveTo(-17,0);ctx.lineTo(17,0);ctx.lineTo(9,-170);ctx.lineTo(-9,-170);ctx.fill();ctx.restore();const y=450-56*zoom;
 sprite(s.glow,cx,y+Math.round(Math.sin(time*2.3-.7)*4)*zoom,(1.25+.3*p)*zoom,time*.35,.6+.4*p,true);sprite(s.body[Math.floor(time*14)%s.body.length],cx,y+Math.round(Math.sin(time*2.3)*4)*zoom,zoom);let key=Math.floor(time*12)%16;key=key<=8?key:16-key;sprite(s.ember[key],cx,y,zoom,0,1,true)}
 status.textContent=`${time.toFixed(2)}s · ${speed}× · ${paused?'PAUSED':'PLAYING'} · body frame ${Math.floor(time*14)%skins[1].body.length+1}/${skins[1].body.length}`;window.__CHAKRA_GOURD_REVIEW__={ready:true,time,speed,paused,zoom,bodyFrames:skins[1].body.length,sparkFrames:9}}
document.querySelector('#half').onclick=()=>{speed=.5};document.querySelector('#normal').onclick=()=>{speed=1};document.querySelector('#pause').onclick=()=>{paused=!paused};document.querySelector('#step').onclick=()=>{paused=true;time+=1/14;render()};document.querySelector('#detail').onclick=()=>{zoom=2};document.querySelector('#game').onclick=()=>{zoom=.665};function tick(now){if(!paused)time+=(now-last)/1000*speed;last=now;render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
